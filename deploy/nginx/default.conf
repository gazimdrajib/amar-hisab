# Nginx reverse proxy for Amar Hisab.
# - HTTPS termination with Let's Encrypt certificates (see deploy.sh / certbot)
# - Serves the Flutter web build as static files
# - Proxies /api/* to the Dart backend
#
# Placeholder self-signed certs may be used for first boot; replace with real
# Let's Encrypt certs using `docker compose -f docker-compose.prod.yml --profile tls run --rm certbot`.

upstream amar_hisab_backend {
    server backend:8080;
}

# Redirect all HTTP to HTTPS, and serve ACME http-01 challenge.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificate pair – replaced by certbot.  Self-signed fallback is
    # generated by deploy.sh so nginx starts before certs exist.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Hardened TLS settings (Mozilla intermediate profile)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static Flutter web build (mounted read-only from the host).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass         http://amar_hisab_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        # Allow larger payloads (backups, report exports)
        client_max_body_size 50m;
    }

    # Health endpoint (also proxied for monitoring convenience).
    location /health {
        proxy_pass http://amar_hisab_backend/health;
        access_log off;
    }

    # Metrics endpoint: restrict to local/monitoring network in production.
    location /metrics {
        proxy_pass http://amar_hisab_backend/metrics;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }
}
