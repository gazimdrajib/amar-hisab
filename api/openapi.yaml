components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }

  responses:
    SuccessEnvelope:
      description: Successful response wrapped in the standard envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    CreatedEnvelope:
      description: Resource created (envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NoContent:
      description: No body

    Unauthorized:
      description: JWT missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, example: "ok" }
            service: { type: string, example: "amar_hisab" }
            version: { type: string, example: "1.0.0" }
            timestamp: { type: string, format: date-time }

    Envelope:
      type: object
      properties:
        ok: { type: boolean, example: true }
        data: { type: object }
        meta: { type: object }

    ErrorEnvelope:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                user: { $ref: '#/components/schemas/User' }
                permissions:
                  type: array
                  items: { type: string }

    MeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: '#/components/schemas/User' }
                permissions:
                  type: array
                  items: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        roleId: { type: integer }
        isActive: { type: boolean }

    UserInput:
      type: object
      required: [username, fullName, roleId]
      properties:
        username: { type: string }
        fullName: { type: string }
        roleId: { type: integer }
        password: { type: string, format: password }

    SaleInput:
      type: object
      required: [items, payments]
      properties:
        customerId: { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [productId, quantity, unitPrice]
            properties:
              productId: { type: integer }
              quantity: { type: number }
              unitPrice: { type: number }
              batchId: { type: integer, nullable: true }
        payments:
          type: array
          items:
            type: object
            required: [method, amount]
            properties:
              method: { type: string, enum: [cash, bkash, card, credit] }
              amount: { type: number }
        note: { type: string, nullable: true }
        applyDiscount: { type: boolean, nullable: true }
        discountAmount: { type: number, nullable: true }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parentId: { type: integer, nullable: true }
        description: { type: string, nullable: true }

    BrandInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }

    UnitInput:
      type: object
      required: [name, abbreviation]
      properties:
        name: { type: string }
        abbreviation: { type: string }

    ProductInput:
      type: object
      required: [name, categoryId, unitId, sellingPrice]
      properties:
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        categoryId: { type: integer }
        brandId: { type: integer, nullable: true }
        unitId: { type: integer }
        sellingPrice: { type: number }
        costPrice: { type: number, nullable: true }
        batchTracked: { type: boolean, default: false }
        isActive: { type: boolean, default: true }

    WarehouseInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        location: { type: string, nullable: true }
        isActive: { type: boolean, default: true }
