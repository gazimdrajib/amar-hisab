openapi: 3.0.3
info:
  title: Amar Hisab – Local Server API
  description: |
    The Amar Hisab local server is a Shelf-based REST API that powers the
    desktop / mobile POS front-ends, plus the optional cloud sync integration.
    All mutating endpoints require a valid JWT issued via `/api/v1/auth/login`
    unless marked as public.
  version: 1.0.0
  contact:
    name: Amar Hisab Support
    email: support@amarhisab.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://hisab.example.com
    description: Production (proxied through nginx)

tags:
  - name: auth
    description: Authentication & current user
  - name: setup
    description: First-run setup wizard (no auth required)
  - name: users
    description: User management
  - name: products
    description: Catalog (categories, brands, units, products)
  - name: inventory
    description: Warehouses, stock, batches and adjustments
  - name: sales
    description: Sales lifecycle, returns and payments
  - name: purchases
    description: Purchase orders, suppliers and payments
  - name: accounting
    description: Chart of accounts, journals, ledger
  - name: reports
    description: Reporting and exports (Excel / PDF)
  - name: sync
    description: Cloud-sync status and triggers
  - name: portal
    description: Public student / customer self-service

paths:
  /health:
    get:
      summary: Liveness probe
      operationId: healthCheck
      tags: [setup]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: metrics
      tags: [setup]
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  /api/docs:
    get:
      summary: Swagger UI for this API
      tags: [setup]
      responses:
        '200':
          description: HTML documentation page
          content:
            text/html:
              schema: { type: string }

  /api/openapi.yaml:
    get:
      summary: This OpenAPI document
      tags: [setup]
      responses:
        '200':
          description: The OpenAPI 3.0 spec
          content:
            application/yaml:
              schema: { type: string }

  # ---------------------------------------------------------------- setup
  /setup/status:
    get:
      summary: Report whether first-run setup has been completed
      tags: [setup]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEnvelope'

  /setup/initialize:
    post:
      summary: Create the business + owner in one step (first-run only)
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, ownerUsername, ownerPassword, ownerFullName]
              properties:
                businessName: { type: string }
                businessType: { type: string, default: retail }
                currency: { type: string, default: BDT }
                taxDefault: { type: number, default: 0 }
                ownerUsername: { type: string }
                ownerPassword: { type: string, format: password, minLength: 8 }
                ownerFullName: { type: string }
      responses:
        '201':
          description: Business created; JWT for the Owner returned in `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Setup already completed

  # ---------------------------------------------------------------- auth
  /api/v1/auth/login:
    post:
      summary: Log in
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      summary: Current user with permissions
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user + permission list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  # ---------------------------------------------------------------- users
  /api/v1/users:
    get:
      summary: List users
      tags: [users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PageParam' }]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEnvelope'
    post:
      summary: Create user
      tags: [users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          $ref: '#/components/responses/CreatedEnvelope'

  /api/v1/users/{id}:
    get:
      summary: Get user
      tags: [users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEnvelope'
    put:
      summary: Update user
      tags: [users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          $ref: '#/components/responses/SuccessEnvelope'
    delete:
      summary: Delete or deactivate user
      tags: [users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204':
          $ref: '#/components/responses/NoContent'

