global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  rule_files: []

scrape_configs:
  - job_name: amar-hisab
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway.docker.internal:8080", "localhost:8080"]
        labels:
          service: amar-hisab
          env: production

# NOTE: This is a template – adjust targets for your environment.  On a
# docker-compose stack the scrape target is the `backend` service name (port
# 8080).  For bare-metal installs keep localhost.
